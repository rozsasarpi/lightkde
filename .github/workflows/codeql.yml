name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 2 1 * *'  # monthly run at 02:30 UTC on the 1st

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.38.0
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v4.38.0
        with:
          category: "/language:python"
